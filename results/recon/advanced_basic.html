<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕷️</text></svg>">
    <title>The Ancient Door - Inspection</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #b3b3b3;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            background-image: 
                radial-gradient(#333 1px, transparent 1px),
                radial-gradient(#333 1px, transparent 1px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .web-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
            background: #2a2a2a;
            border: 2px solid #4a4a4a;
            border-radius: 8px;
            position: relative;
            box-shadow: 0 0 20px rgba(128, 128, 128, 0.1);
            text-align: center;
        }

        .web-corner {
            position: absolute;
            width: 50px;
            height: 50px;
            border: 4px solid #4a4a4a;
            border-radius: 2px;
        }

        .web-corner-tl {
            top: -10px;
            left: -10px;
            border-right: none;
            border-bottom: none;
        }

        .web-corner-tr {
            top: -10px;
            right: -10px;
            border-left: none;
            border-bottom: none;
        }

        .web-corner-bl {
            bottom: -10px;
            left: -10px;
            border-right: none;
            border-top: none;
        }

        .web-corner-br {
            bottom: -10px;
            right: -10px;
            border-left: none;
            border-top: none;
        }

        h1 {
            color: #8a8a8a;
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        p {
            font-size: 1.2em;
            line-height: 1.6;
            margin: 20px 0;
            padding: 10px;
            border-left: 3px solid #4a4a4a;
            transition: all 0.3s ease;
            text-align: center;
            background: #252525;
        }

        p:hover {
            background: #333;
            transform: translateX(10px);
            border-left-color: #666;
        }

        .spider-cursor {
            cursor: crosshair;
        }

        .ancient-text {
            font-family: 'Courier New', monospace;
            color: #666;
            font-style: italic;
            font-size: 0.8em;
            margin-top: 40px;
            text-align: center;
        }

        .ancient-text::before, .ancient-text::after {
            content: "✧";
            margin: 0 10px;
            color: #4a4a4a;
        }

        .spinner {
            display: none;
            width: 50px;
            height: 50px;
            border: 5px solid #333;
            border-radius: 50%;
            border-top: 5px solid #4a4a4a;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #result-container {
            margin: 20px;
            padding: 15px;
            border: 1px solid #4a4a4a;
            border-radius: 5px;
            display: none;
            background: #252525;
            color: #b3b3b3;
            text-align: left;
            max-width: 100%;
            overflow-x: auto;
        }

        #result-content {
            text-align: left;
            white-space: pre-wrap;
            word-wrap: break-word;
            word-break: break-all;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 10px;
            background: #1d1d1d;
            border-radius: 4px;
            max-width: 100%;
            overflow-x: auto;
        }

        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            word-break: break-all;
            max-width: 100%;
        }

        .success {
            color: #6aaa6a;
        }

        .error {
            color: #aa6a6a;
        }

        #message {
            color: #aa6a6a;
            font-style: italic;
            margin: 20px 0;
            padding: 10px;
            border-left: 3px solid #4a4a4a;
        }

        #fingerprint-data {
            font-family: 'Courier New', monospace;
            padding: 10px;
            margin: 10px 0;
            background: #252525;
            border-radius: 4px;
        }
    </style>
</head>
<body class="spider-cursor">
    <div class="web-container">
        <div class="web-corner web-corner-tl"></div>
        <div class="web-corner web-corner-tr"></div>
        <div class="web-corner web-corner-bl"></div>
        <div class="web-corner web-corner-br"></div>
        
        <h1>The Ancient Door Examines</h1>
        <p>*spider tilts head curiously*</p>
        <p>*carefully inspects your web patterns*</p>
        <p id="message">Info received</p>
        <div id="fingerprint-data"></div>
        <div class="spinner" id="loading-spinner"></div>
        <div id="result-container">
            <h3>Ancient Web Patterns:</h3>
            <pre id="result-content"></pre>
        </div>
        <div class="ancient-text">The door's ancient mechanisms whir and click as they analyze your presence...</div>
        <script>
            (async function collectFingerprintData() {
      // Show spinner while collecting data
      const spinner = document.getElementById('loading-spinner');
      const resultContainer = document.getElementById('result-container');
      const resultContent = document.getElementById('result-content');
      
      spinner.style.display = 'block';

      // 1. WebDriver flag (true in headless browsers or automated environments)
      const isWebDriver = navigator.webdriver || false;

      // 2. Plugins length (bots often have none)
      const pluginsLength = navigator.plugins.length;

      // 3. Languages (bots often have just one or spoofed)
      const languages = navigator.languages || [];

      // 4. Canvas fingerprinting
      function getCanvasFingerprint() {
        try {
          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");
          ctx.textBaseline = "top";
          ctx.font = "14px 'Arial'";
          ctx.fillStyle = "#f60";
          ctx.fillRect(125, 1, 62, 20);
          ctx.fillStyle = "#069";
          ctx.fillText("Canvas Fingerprint!", 2, 15);
          ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
          ctx.fillText("Canvas Fingerprint!", 4, 17);
          return canvas.toDataURL();
        } catch (e) {
          return null;
        }
      }

      // 5. AudioContext fingerprinting
      async function getAudioFingerprint() {
        try {
          const audioCtx = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, 44100, 44100);
          const oscillator = audioCtx.createOscillator();
          const compressor = audioCtx.createDynamicsCompressor();

          oscillator.type = "triangle";
          oscillator.frequency.value = 10000;

          compressor.threshold.value = -50;
          compressor.knee.value = 40;
          compressor.ratio.value = 12;
          compressor.attack.value = 0;
          compressor.release.value = 0.25;

          oscillator.connect(compressor);
          compressor.connect(audioCtx.destination);
          oscillator.start(0);
          const renderedBuffer = await audioCtx.startRendering();
          const data = renderedBuffer.getChannelData(0);
          let sum = 0;
          for (let i = 0; i < data.length; i++) {
            sum += Math.abs(data[i]);
          }
          return sum.toString();
        } catch (e) {
          return null;
        }
      }

      const canvasFingerprint = getCanvasFingerprint();
      const audioFingerprint = await getAudioFingerprint();

      // Combine data
      const fingerprintData = {
        isWebDriver,
        pluginsLength,
        languages,
        canvasFingerprint,
        audioFingerprint,
      };

      try {
        // Send to backend
        const response = await fetch('/fingerprint/js/basic', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(fingerprintData)
        });

        if (response.status === 403) {
            const html = await response.text();
            resultContainer.innerHTML = html;
            spinner.style.display = 'none';
            resultContainer.style.display = 'block';

            return;
        }

        const result = await response.json();
        
        // Hide spinner and show results
        spinner.style.display = 'none';
        resultContainer.style.display = 'block';
        resultContent.innerHTML = JSON.stringify(result, null, 2);
        resultContent.className = 'success';
      } catch (error) {
        // Handle error
        spinner.style.display = 'none';
        resultContainer.style.display = 'block';
        resultContent.innerHTML = 'Error: ' + error.message;
        resultContent.className = 'error';
      }

      console.log("Fingerprint data processed");
    })();
        </script>
    </div>
</body>
</html>
